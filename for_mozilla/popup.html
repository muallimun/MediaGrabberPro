<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Universal Media Grabber Pro 30.1.0</title>
    <style>
        :root {
            --primary: #8e44ad; --primary-dark: #713592; --success: #27ae60;
            --success-soft: #d1fae5; --danger: #e74c3c; --warning: #f39c12;
            --dark: #2c3e50; --border: #e2e8f0; --border-soft: #f1f5f9;
            --text-main: #1e293b; --text-sub: #64748b; --text-muted: #94a3b8;
            --bg-app: #ffffff; --bg-soft: #f8fafc;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04); --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.15);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #9b59b6; --primary-dark: #8e44ad; --success: #2ecc71;
                --success-soft: #14532d; --danger: #e74c3c; --warning: #f39c12;
                --dark: #1e293b; --border: #334155; --border-soft: #1e293b;
                --text-main: #f8fafc; --text-sub: #94a3b8; --text-muted: #64748b;
                --bg-app: #0f172a; --bg-soft: #1e293b;
                --shadow-sm: 0 1px 2px rgba(0,0,0,0.3); --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.4);
            }
        }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; width: 680px; height: 580px; margin: 0; padding: 0; background: var(--bg-app); color: var(--text-main); font-size: 13px; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); color: white; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-title { font-weight: 800; font-size: 16px; letter-spacing: -0.3px; }
        .badge { background: var(--danger); padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 700; min-width: 20px; text-align: center; display: inline-block; margin-left: 6px; vertical-align: middle; }
        .header-actions { display: flex; gap: 6px; }
        .icon-btn-header { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.15s; }
        .icon-btn-header:hover { background: rgba(255,255,255,0.2); }
        #closePopup { background: rgba(231, 76, 60, 0.2); border-color: rgba(231, 76, 60, 0.4); }
        #closePopup:hover { background: var(--danger); }

        #settingsPanel { display: none; background: var(--bg-app); padding: 0; border-bottom: 1px solid var(--border); position: absolute; top: 60px; left: 0; right: 0; z-index: 50; box-shadow: var(--shadow-lg); max-height: 480px; overflow-y: auto; }
        .settings-header { padding: 16px 20px 12px; border-bottom: 1px solid var(--border-soft); display: flex; justify-content: space-between; align-items: center; }
        .settings-header h3 { margin: 0; font-size: 14px; font-weight: 700; color: var(--text-main); }
        .settings-section { padding: 14px 20px; border-bottom: 1px solid var(--border-soft); }
        .settings-section:last-of-type { border-bottom: none; }
        .settings-section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; margin-bottom: 10px; }
        .setting-item { margin-bottom: 12px; }
        .setting-item:last-child { margin-bottom: 0; }
        .setting-label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 12px; color: var(--text-main); }
        .setting-input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; transition: border-color 0.15s; outline: none; background: var(--bg-app); color: var(--text-main); }
        .setting-input:focus { border-color: var(--primary); }
        .opt-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; background: var(--bg-soft); padding: 10px 12px; border-radius: 8px; margin-top: 4px; }
        .opt-row label { font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--text-main); }
        .opt-row input { cursor: pointer; }
        .checkbox-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bg-soft); border-radius: 8px; cursor: pointer; font-size: 12px; color: var(--text-main); transition: background 0.15s; }
        .checkbox-item:hover { filter: brightness(0.95); }
        .checkbox-item input { cursor: pointer; }
        .checkbox-item.danger { color: var(--danger); font-weight: 600; }
        .settings-save-btn { width: calc(100% - 40px); margin: 0 20px 16px; height: 42px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; letter-spacing: 0.3px; transition: background 0.15s; }
        .settings-save-btn:hover { background: var(--primary-dark); }
        
        .domain-bar { background: var(--bg-soft); padding: 10px 20px; border-bottom: 1px solid var(--border); display: none; align-items: center; gap: 10px; font-size: 12px; flex-shrink: 0; }
        .domain-bar.visible { display: flex; }
        .domain-bar-label { color: var(--text-sub); white-space: nowrap; }
        .domain-bar-domain { font-weight: 700; color: var(--primary); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .domain-rule-select { margin-left: auto; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-app); color: var(--text-main); font-size: 12px; font-weight: 600; cursor: pointer; outline: none; max-width: 180px; }
        .domain-rule-select:focus { border-color: var(--primary); }
        
        .search-box-container { padding: 12px 20px; background: var(--bg-soft); border-bottom: 1px solid var(--border); display: flex; gap: 10px; flex-shrink: 0; position: relative; }
        .search-wrap { position: relative; flex: 1; display: flex; align-items: center; }
        #searchBox { width: 100%; padding: 10px 14px; padding-right: 32px; border: 1px solid var(--border); border-radius: 10px; outline: none; font-size: 13px; font-family: inherit; transition: border-color 0.15s; background: var(--bg-app); color: var(--text-main); }
        #searchBox:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(142, 68, 173, 0.1); }
        #clearSearchBtn { position: absolute; right: 8px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; display: none; padding: 4px; border-radius: 50%; }
        #clearSearchBtn:hover { color: var(--danger); background: var(--border-soft); }
        #scanPageBtn { background: #3498db; color: white; border: none; padding: 0 18px; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer; transition: background 0.15s; white-space: nowrap; }
        #scanPageBtn:hover { background: #2980b9; }
        #scanPageBtn:disabled { opacity: 0.7; cursor: wait; }
        
        .controls-row { display: flex; background: var(--bg-soft); padding: 6px 12px; gap: 6px; border-bottom: 1px solid var(--border); align-items: center; flex-shrink: 0; }
        .tabs-container { display: flex; flex: 1; gap: 2px; overflow-x: auto; }
        .tab-btn { border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 10px; font-weight: 700; color: var(--text-sub); background: transparent; text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap; transition: all 0.15s; }
        .tab-btn:hover { background: rgba(142, 68, 173, 0.1); color: var(--primary); }
        .tab-btn.active { background: var(--bg-app); color: var(--primary); box-shadow: var(--shadow-sm); }
        
        .size-indicator { font-size: 11px; font-weight: 600; color: var(--text-sub); white-space: nowrap; margin-left: 8px; padding-right: 8px; border-right: 1px solid var(--border); }
        #sortSelect { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); font-size: 11px; background: var(--bg-app); color: var(--text-main); cursor: pointer; outline: none; font-family: inherit; }
        
        #list { flex: 1; overflow-y: auto; padding: 0; }
        #list::-webkit-scrollbar { width: 8px; }
        #list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        .item { display: flex; align-items: center; padding: 10px 20px; border-bottom: 1px solid var(--border-soft); background: var(--bg-app); min-height: 62px; transition: background 0.15s; position: relative; }
        .item:hover { background: var(--bg-soft); }
        .item.selected { background: rgba(142, 68, 173, 0.1); }
        .item.downloaded { background: linear-gradient(to right, var(--success-soft), var(--bg-app)); border-left: 3px solid var(--success); padding-left: 17px; }
        .item.downloading { background: rgba(243, 156, 18, 0.1); border-left: 3px solid var(--warning); padding-left: 17px; }
        .item.error { background: rgba(231, 76, 60, 0.1); border-left: 3px solid var(--danger); padding-left: 17px; }
        .check-col { width: 30px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .check-col input { cursor: pointer; width: 15px; height: 15px; }
        .info-col { flex: 1; display: flex; align-items: center; gap: 12px; overflow: hidden; margin-right: 10px; min-width: 0; }
        .file-icon { font-size: 18px; width: 38px; height: 38px; background: var(--bg-soft); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .file-details { overflow: hidden; display: flex; flex-direction: column; min-width: 0; flex: 1; }
        .name { font-weight: 500; font-size: 13px; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .meta { font-size: 11px; color: var(--text-sub); display: flex; align-items: center; gap: 5px; margin-top: 3px; flex-wrap: nowrap; overflow: hidden; }
        .meta > span { white-space: nowrap; }
        .meta .tag { background: var(--border); color: var(--text-main); padding: 1px 6px; border-radius: 4px; font-weight: 700; font-size: 9px; letter-spacing: 0.3px; flex-shrink: 0; }
        .meta .tag.eba { background: var(--warning); color: white; }
        .meta .tag.scan { background: #3498db; color: white; }
        .meta .sep { color: var(--text-muted); }
        .meta .domain { color: var(--primary); font-weight: 600; max-width: 130px; overflow: hidden; text-overflow: ellipsis; }
        .status-badge { padding: 1px 6px; border-radius: 4px; font-weight: 700; font-size: 9px; letter-spacing: 0.3px; flex-shrink: 0; }
        .status-badge.downloaded { background: var(--success-soft); color: var(--success); }
        .status-badge.downloading { background: rgba(243, 156, 18, 0.2); color: var(--warning); }
        .status-badge.error { background: rgba(231, 76, 60, 0.2); color: var(--danger); }
        .action-col { display: flex; gap: 3px; align-items: center; flex-shrink: 0; }
        .icon-btn { width: 30px; height: 30px; border-radius: 6px; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-sub); border: none; font-size: 14px; transition: all 0.15s; }
        .icon-btn:hover { background: var(--bg-soft); color: var(--primary); }
        .icon-btn.del-btn:hover { color: var(--danger); background: rgba(231, 76, 60, 0.1); }
        .icon-btn.dl-btn { color: var(--success); }
        .icon-btn.dl-btn:hover { background: var(--success-soft); }
        
        .dropdown-wrap { position: relative; }
        .dropdown-menu { display: none; position: absolute; top: 100%; right: 0; background: var(--bg-app); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow-lg); z-index: 500; min-width: 200px; padding: 4px; margin-top: 4px; }
        .dropdown-menu.open { display: block; }
        .dropdown-menu button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border: none; background: transparent; cursor: pointer; font-size: 12px; text-align: left; border-radius: 5px; color: var(--text-main); font-family: inherit; transition: background 0.1s; }
        .dropdown-menu button:hover { background: var(--bg-soft); color: var(--primary); }
        .dropdown-menu .danger-text { color: var(--danger); font-weight: 600; border-top: 1px solid var(--border-soft); margin-top: 4px; padding-top: 8px; border-radius: 0 0 5px 5px;}
        .dropdown-menu .danger-text:hover { background: rgba(231, 76, 60, 0.1); color: var(--danger); }

        .footer { padding: 12px 16px; background: var(--bg-soft); border-top: 1px solid var(--border); display: flex; gap: 8px; flex-shrink: 0; }
        .main-btn { border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center; text-transform: uppercase; white-space: nowrap; transition: all 0.15s; letter-spacing: 0.3px; font-family: inherit; }
        #downloadAll { background: var(--success); color: white; flex: 1.5; }
        #downloadZip { background: var(--warning); color: white; flex: 1; }
        
        .export-dropdown-wrap { position: relative; flex: 1; }
        #exportBtn { background: transparent; color: var(--text-main); border: 1px solid var(--border); width: 100%; }
        #exportBtn:hover { background: var(--bg-app); border-color: var(--primary); color: var(--primary); }
        .export-menu { bottom: 100%; top: auto; margin-bottom: 4px; right: 0; left: 0; width: 100%; min-width: 150px; }
        
        #clearDownloaded { background: transparent; color: var(--warning); border: 1px solid var(--warning); flex: 1; }
        #clearAll { background: transparent; color: var(--text-sub); border: 1px solid var(--border); flex: 0.8; }
        #clearAll:hover { color: var(--danger); border-color: var(--danger); }
        
        #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--dark); color: white; padding: 12px 22px; border-radius: 10px; opacity: 0; visibility: hidden; transition: all 0.3s ease; z-index: 1000; font-weight: 600; text-align: center; font-size: 13px; box-shadow: var(--shadow-lg); }
        #toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
        #toast.warning { background: var(--warning); }
        #toast.success { background: var(--success); }
        
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); text-align: center; padding: 0 20px; font-size: 13px; }
        .empty-state .empty-icon { font-size: 42px; margin-bottom: 12px; opacity: 0.5; }
        
        #videoModal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 2000; flex-direction: column; justify-content: center; align-items: center; }
        #videoModal.open { display: flex; }
        #closeVideoBtn { position: absolute; top: 20px; right: 20px; background: #fff; color: #e74c3c; border: none; padding: 8px 15px; border-radius: 8px; font-weight: 800; cursor: pointer; font-family: inherit; }
        #videoPlayer { width: 90%; max-height: 80%; border-radius: 8px; outline: none; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.6); z-index: 1500; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.open { display: flex; }
        .modal-box { background: var(--bg-app); border-radius: 14px; width: 100%; max-width: 520px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 25px 50px rgba(0,0,0,0.25); overflow: hidden; border: 1px solid var(--border); }
        .modal-head { padding: 18px 22px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-head h2 { margin: 0; font-size: 15px; font-weight: 700; color: var(--text-main); }
        .modal-x { background: transparent; border: none; font-size: 18px; cursor: pointer; color: var(--text-sub); padding: 4px 8px; border-radius: 6px; font-family: inherit; }
        .modal-x:hover { background: var(--bg-soft); }
        .modal-body { padding: 16px 22px; overflow-y: auto; flex: 1; }
        .modal-foot { padding: 12px 22px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; background: var(--bg-soft); }
        .modal-btn { border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12px; font-family: inherit; transition: all 0.15s; }
        .modal-btn.primary { background: var(--primary); color: white; }
        .modal-btn.secondary { background: var(--bg-app); color: var(--text-main); border: 1px solid var(--border); }
        
        .detail-row { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--border-soft); font-size: 12px; }
        .detail-row:last-child { border-bottom: none; }
        .detail-row .key { color: var(--text-sub); font-weight: 600; }
        .detail-row .val { color: var(--text-main); word-break: break-word; }
        .detail-row.full { display: block; }
        .detail-row.full .key { display: block; margin-bottom: 6px; }
        .detail-url { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-family: 'Menlo', 'Consolas', monospace; font-size: 11px; color: var(--text-main); background: var(--bg-soft); resize: none; height: 60px; outline: none; }
        
        .help-section { margin-bottom: 16px; }
        .help-section h4 { margin: 0 0 4px 0; font-size: 14px; color: var(--primary); }
        .help-section p { margin: 0; font-size: 12px; line-height: 1.5; color: var(--text-sub); }

        .branding-bar { text-align: center; padding: 8px 0; background: var(--border-soft); font-size: 10px; font-weight: 600; border-top: 1px solid var(--border); color: var(--text-muted); flex-shrink: 0; }
        .branding-bar a { color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>

    <div id="videoModal">
        <button id="closeVideoBtn" data-i18n="videoClose">✖ KAPAT</button>
        <video id="videoPlayer" controls></video>
    </div>

                <select id="namingMethod" class="setting-input">

                    <option value="pageTitle" data-i18n="pageTitleNaming">Her Zaman Sayfa Başlığını Kullan</option>

                    <option value="custom" data-i18n="customNaming">Özel Sabit Başlık</option>

            </div>
            <div id="customNameContainer" class="setting-item" style="display:none;">
                <label class="setting-label" data-i18n="customNameLabel">Özel Başlık:</label>
                <input type="text" id="customNameInput" class="setting-input">
            </div>
            <div class="setting-item">
                <label class="setting-label" data-i18n="extraInfoLabel">İsme Eklenecek Bilgiler:</label>
                <div class="opt-row">
                    <label><input type="checkbox" id="addDomain"> <span data-i18n="addDomain">Alan Adı</span></label>
                    <label><input type="checkbox" id="addDate"> <span data-i18n="addDate">Tarih</span></label>
                    <label><input type="checkbox" id="addTime"> <span data-i18n="addTime">Saat</span></label>
                </div>
            </div>
        </div>
        <div class="settings-section">
            <div class="settings-section-label" data-i18n="sectionFiltering">Filtreleme & Davranış</div>
            <div class="setting-item">
                <label class="checkbox-item">
                    <input type="checkbox" id="adShieldEnabled">
                    <span data-i18n="adShieldLabel">Reklam Kalkanı</span>
                </label>
            </div>
            <div class="setting-item">
                <label class="checkbox-item">
                    <input type="checkbox" id="notificationsCheck">
                    <span data-i18n="notificationsLabel">Yeni medya yakalandığında bildirim göster</span>
                </label>
            </div>
            <div class="setting-item">
                <label class="checkbox-item danger">
                    <input type="checkbox" id="autoClearCheck">
                    <span data-i18n="autoClearLabel">Tarayıcı açıldığında listeyi temizle</span>
                </label>
            </div>
            <div class="setting-item">
                <label class="checkbox-item">
                    <input type="checkbox" id="devModeCheck">
                    <span data-i18n="devModeLabel">Geliştirici Modu</span>
                </label>
            </div>
        </div>
        <button id="saveSettings" class="settings-save-btn" data-i18n="saveSettingsBtn">AYARLARI KAYDET</button>
    </div>

    <div class="domain-bar" id="domainRuleBar">
        <span class="domain-bar-label" data-i18n="domainBarLabel">Bu site için:</span>
        <span class="domain-bar-domain" id="currentDomain">...</span>
        <select class="domain-rule-select" id="domainRuleSelect">
            <option value="all" data-i18n="ruleAll">🌐 Tümünü Yakala</option>
            <option value="audio" data-i18n="ruleAudio">🎵 Sadece Ses</option>
            <option value="video" data-i18n="ruleVideo">🎬 Sadece Video</option>
            <option value="documents" data-i18n="ruleDocuments">📄 Sadece Belgeler</option>
            <option value="muted" data-i18n="ruleMuted">🚫 Tamamen Sustur</option>
        </select>
    </div>

    <div class="search-box-container">
        <div class="search-wrap">
            <input type="text" id="searchBox" data-i18n-placeholder="searchPlaceholder" placeholder="🔍 Dosya adı ara...">
            <button id="clearSearchBtn" title="Aramayı Temizle">✖</button>
        </div>
        <button id="scanPageBtn" data-i18n="scanBtn" data-i18n-title="scanBtn" title="Sayfadaki tüm dosyaları bul">🔍 TARA</button>
    </div>

    <div class="controls-row">
        <div class="tabs-container">
            <button class="tab-btn active" data-filter="all" data-i18n="tabAll">HEPSİ</button>
            <button class="tab-btn" data-filter="Ses" data-i18n="tabAudio">SESLER</button>
            <button class="tab-btn" data-filter="Video" data-i18n="tabVideo">VİDEOLAR</button>
            <button class="tab-btn" data-filter="PDF" data-i18n="tabPdf">PDF/BELGE</button>
            <button class="tab-btn" data-filter="SCORM" data-i18n="tabScorm">PAKET/SCORM</button>
            <button class="tab-btn" data-filter="downloaded" data-i18n="tabDownloaded">✅ İNDİRİLENLER</button>
        </div>
        
        <select id="sortSelect">
            <option value="newest" data-i18n="sortNewest">En Yeni</option>
            <option value="oldest" data-i18n="sortOldest">En Eski</option>
            <option value="name_asc" data-i18n="sortNameAsc">İsim A-Z</option>
            <option value="name_desc" data-i18n="sortNameDesc">İsim Z-A</option>
            <option value="size_desc" data-i18n="sortSizeDesc">Boyut ↓</option>
            <option value="size_asc" data-i18n="sortSizeAsc">Boyut ↑</option>
        </select>
    </div>

    <div id="list"></div>

    <div class="footer" id="footerControls">
        <button id="downloadAll" class="main-btn" data-i18n="downloadAll">⬇ TÜMÜNÜ İNDİR</button>
        <button id="downloadZip" class="main-btn" data-i18n="downloadZip">📦 ZIP</button>
        
        <div class="export-dropdown-wrap">
            <button id="exportBtn" class="main-btn" data-i18n-title="exportBtnTooltip" title="URL'leri Dışa Aktar">💾</button>
            <div class="dropdown-menu export-menu" id="exportMenu">
                <button id="exportTxtBtn" data-i18n="exportTxt">📄 TXT Olarak İndir</button>
                <button id="copyUrlsBtn" data-i18n="copyUrls">📋 Tüm URL'leri Kopyala</button>
            </div>
        </div>

        <button id="clearDownloaded" class="main-btn" data-i18n="clearDownloaded">🧹 İNDİRİLENLERİ SİL</button>
        <button id="clearAll" class="main-btn" data-i18n="clearAll">🗑 TEMİZLE</button>
    </div>

    <div class="branding-bar">
        <span data-i18n="brandingPoweredBy">Powered by</span> <a href="https://www.muallimun.com" target="_blank">www.muallimun.net</a>
    </div>

    <div id="toast"><span id="toastMsg"></span></div>

    <script src="popup.js"></script>
</body>
